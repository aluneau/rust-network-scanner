[package]
name = "rust-network-scanner"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_network_scanner"
path = "src/lib.rs"

[[bin]]
name = "network-scanner"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
ipnetwork = "0.20"
socket2 = "0.5"
futures = "0.3"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
